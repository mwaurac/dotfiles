# ╭─────────────────────────────────────────────╮
# │  tmux.conf — Catppuccin Mocha               │
# │  prefix: Ctrl+Space | zsh shell             │
# ╰─────────────────────────────────────────────╯

# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shell
set -g default-shell /usr/bin/zsh

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0           # no delay for neovim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",ghostty:RGB"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ── Catppuccin Mocha colours ─────────────────────────────────
# https://github.com/catppuccin/tmux (manual palette)

base="#1e1e2e"
surface0="#313244"
surface1="#45475a"
overlay0="#6c7086"
text="#cdd6f4"
subtext1="#bac2de"
mauve="#cba6f7"
blue="#89b4fa"
teal="#94e2d5"
green="#a6e3a1"

# Status bar
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left — session name
set -g status-left-length 30
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#cba6f7] "

# Right — host + time
set -g status-right-length 60
set -g status-right "#[fg=#6c7086] %H:%M #[fg=#313244]│#[fg=#89b4fa] #H "

# Window tabs
set -g window-status-format         "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "
set -g window-status-separator      ""

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Messages
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style    "bg=#cba6f7,fg=#1e1e2e"

