# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Shell
set -g default-shell /usr/bin/zsh

# General
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0           # no delay for neovim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",ghostty:RGB"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100


# plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'

# COntinuum configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# catppuchin configuration
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
# git branch without the gitmux binary
set -g @catppuccin_gitmux_text ' #(git -C "#{pane_current_path}" rev-parse --abbrev-ref HEAD 2>/dev/null)'
# clock: time only
set -g @catppuccin_date_time_text " %H:%M"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Status line modules
set -gF status-left "#{E:@catppuccin_status_session}"
set -gF status-right "#{E:@catppuccin_status_gitmux}#{E:@catppuccin_status_load}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}"

run '~/.config/tmux/plugins/tpm/tpm'
